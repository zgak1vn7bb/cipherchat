<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { margin:0; padding:0; background:#0A0E14; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
.loading { text-align:center; }
.spinner { width:40px; height:40px; border:3px solid #333; border-top-color:#5B9BD5; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 15px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <div>正在加载最新版本...</div>
</div>
<script>
const SUPABASE_URL = "https://xrfzqlwrkidsblxofevj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9l8AW-w--GORou1AaAD95g_TOQrQ-0f";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadLatest() {
  const { data, error } = await sb.from("app_config").select("chat_html").eq("id", 1).single();
  if (error || !data || !data.chat_html) {
    document.body.innerHTML = "<div style='text-align:center;'>加载失败，请刷新重试<br><small>如果是第一次使用，请先在后台上传版本</small></div>";
    return;
  }
  // 把最新版页面写到当前页面
  document.open();
  document.write(data.chat_html);
  document.close();
}
loadLatest();
</script>
</body>
</html>
